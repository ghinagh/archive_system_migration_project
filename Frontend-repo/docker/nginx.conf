server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # =========================
    # Angular SPA routing fix
    # =========================
    location / {
        try_files $uri $uri/ /index.html;
    }

    # =========================
    # index.html must never be cached or revalidated via ETag — it references
    # content-hashed chunk filenames, and a conditional GET that resolves to
    # 304 would let the browser keep reusing a stale cached body indefinitely.
    # no-store forbids storage outright, so there is nothing to revalidate.
    # =========================
    location = /index.html {
        add_header Cache-Control "no-store" always;
    }

    # =========================
    # i18n translation files are not content-hashed — never let the browser
    # store or reuse them.
    # =========================
    location ~* /assets/i18n/.*\.json$ {
        add_header Cache-Control "no-store" always;
    }

    # =========================
    # Static assets caching (JS/CSS/Images) — safe to cache forever since
    # Angular content-hashes these filenames; a new build gets new names.
    # =========================
    location ~* \.(?:js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # =========================
    # Security headers (basic hardening)
    # =========================
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # =========================
    # Gzip compression (performance)
    # =========================
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_vary on;

    # =========================
    # Logging (optional for ELK)
    # =========================
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;
}