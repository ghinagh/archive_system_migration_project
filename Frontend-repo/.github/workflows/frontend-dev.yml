name: Frontend Dev CI

on:
  push:
    branches: [dev]

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: npm ci
      - run: npm run build
      - run: npm test || true

      - run: docker build -t startupstack/frontend:dev ./docker
      - run: docker run -d -p 4200:80 startupstack/frontend:dev