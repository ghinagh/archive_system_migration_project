<div class="viewer-section">
  <mat-card>
    <mat-card-header>
      <mat-card-title>{{ 'REPORTS.VIEWER.TITLE' | translate }}</mat-card-title>
    </mat-card-header>

    <mat-card-content>
      <mat-form-field appearance="outline" class="type-field">
        <mat-label>{{ 'REPORTS.VIEWER.SELECT_TYPE' | translate }}</mat-label>
        <mat-select [value]="selectedType()" (selectionChange)="selectedType.set($event.value)">
          @for (opt of reportOptions; track opt.value) {
            <mat-option [value]="opt.value">{{ opt.labelKey | translate }}</mat-option>
          }
        </mat-select>
      </mat-form-field>
    </mat-card-content>

    <mat-card-actions class="actions">
      <div class="actions-container">
        <button mat-raised-button color="primary" [disabled]="isGenerating()" (click)="download()">
          <mat-icon>download</mat-icon>
          {{ 'REPORTS.VIEWER.DOWNLOAD_PDF' | translate }}
        </button>
        <button mat-raised-button color="accent" [disabled]="isGenerating()" (click)="preview()">
          <mat-icon>open_in_new</mat-icon>
          {{ 'REPORTS.VIEWER.PREVIEW' | translate }}
        </button>
        @if (isGenerating()) {
          <div class="spinner-overlay">
            <mat-progress-spinner diameter="36" mode="indeterminate"></mat-progress-spinner>
          </div>
        }
      </div>
    </mat-card-actions>
  </mat-card>
</div>
