<mat-tab-group animationDuration="200ms" class="persons-tabs">
  <mat-tab>
    <ng-template mat-tab-label>
      <mat-icon class="tab-icon">people</mat-icon>
      {{ 'PERSONS.PATRONS_TAB' | translate }}
    </ng-template>
    <div class="tab-content">
      <app-person-list></app-person-list>
    </div>
  </mat-tab>

  <mat-tab>
    <ng-template mat-tab-label>
      <mat-icon class="tab-icon">badge</mat-icon>
      {{ 'PERSONS.STAFF_TAB' | translate }}
    </ng-template>
    <div class="tab-content">
      <app-staff-list></app-staff-list>
    </div>
  </mat-tab>
</mat-tab-group>
