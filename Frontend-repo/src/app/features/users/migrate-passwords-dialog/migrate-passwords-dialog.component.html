<h2 mat-dialog-title>{{ 'USERS.MIGRATE_PASSWORDS_TITLE' | translate }}</h2>
<mat-dialog-content>
  <p>{{ 'USERS.MIGRATE_PASSWORDS_DESC' | translate }}</p>
  <p><strong>{{ 'USERS.MIGRATE_PASSWORDS_WARNING' | translate }}</strong></p>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button (click)="onCancel()" [disabled]="isLoading()">
    {{ 'APP.CANCEL' | translate }}
  </button>
  <button mat-raised-button color="warn" (click)="onConfirm()" [disabled]="isLoading()">
    @if (isLoading()) {
      <mat-spinner diameter="20"></mat-spinner>
    } @else {
      {{ 'USERS.MIGRATE_PASSWORDS_CONFIRM' | translate }}
    }
  </button>
</mat-dialog-actions>
