<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <title>FrontendRepo</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <script>
    // Set the correct lang/dir before Angular (and its CDK Directionality
    // service, which reads this once at construction time) bootstraps.
    // Without this, components whose layout depends on Directionality
    // (e.g. floating label position next to an icon prefix) lock in an
    // incorrect LTR-style calculation even though the CSS cascade is RTL.
    (function () {
      var lang = localStorage.getItem('app_lang') || 'ar';
      document.documentElement.lang = lang;
      document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
