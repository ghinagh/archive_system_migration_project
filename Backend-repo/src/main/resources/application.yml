server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: startupstack

  servlet:
    multipart:
      max-file-size: ${MEDIA_MAX_UPLOAD_SIZE:512MB}
      max-request-size: ${MEDIA_MAX_UPLOAD_SIZE:512MB}

  jpa:
    hibernate:
      ddl-auto: none
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        globally_quoted_identifiers: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    validate-on-migrate: false
    out-of-order: true
    ignore-missing-migrations: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  jackson:
    serialization:
      write-dates-as-timestamps: false

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  media:
    base-path: ${MEDIA_BASE_PATH:/media}
    picture-path: ${MEDIA_PICTURE_PATH:/media/pictures}
    extension: ${MEDIA_EXTENSION:}
    archive-path: ${MEDIA_ARCHIVE_PATH:/media/archive}
    volumes:
      - from: 1
        to: 5000
        path: ${MEDIA_VOL1_PATH:/media/vol1}
      - from: 5001
        to: 10000
        path: ${MEDIA_VOL2_PATH:/media/vol2}
  backup:
    directory: ${BACKUP_DIRECTORY:./backups}
    pg-dump-path: ${PG_DUMP_PATH:pg_dump}
