server:
  port: ${SERVER_PORT:8080}
  tomcat:
    # Spring Boot 3.5 caps a multipart request at 10 parts by default; the digital-file
    # upload (استمارة التوثيق › إضافة ملف رقمي) sends up to 14 (file + 13 fields) and failed with 500.
    max-part-count: 50

spring:
  application:
    name: startupstack

  servlet:
    multipart:
      max-file-size: ${MEDIA_MAX_UPLOAD_SIZE:512MB}
      max-request-size: ${MEDIA_MAX_UPLOAD_SIZE:512MB}

  jpa:
    hibernate:
      ddl-auto: none
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        globally_quoted_identifiers: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    validate-on-migrate: false
    out-of-order: true
    ignore-missing-migrations: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  jackson:
    serialization:
      write-dates-as-timestamps: false

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  media:
    base-path: ${MEDIA_BASE_PATH:/media}
    picture-path: ${MEDIA_PICTURE_PATH:/media/pictures}
    extension: ${MEDIA_EXTENSION:}
    archive-path: ${MEDIA_ARCHIVE_PATH:/media/archive}
    volumes:
      - from: 1
        to: 5000
        path: ${MEDIA_VOL1_PATH:/media/vol1}
      - from: 5001
        to: 10000
        path: ${MEDIA_VOL2_PATH:/media/vol2}
  subject-thesaurus:
    # ARCHIVE.frm M6_Click: password1 = "891045" (Frame3 key before Form5 "المكنز الموضوعي" opens)
    access-key: ${SUBJECT_THESAURUS_ACCESS_KEY:891045}
  form-thesaurus:
    # ARCHIVE.frm M2_Click: password1 = "891045" (Frame3 key before coding.frm "المكنز الشكلي" opens)
    access-key: ${FORM_THESAURUS_ACCESS_KEY:891045}
  document-lock:
    # ARCHIVE.frm m30_Click (اقفال الوثائق المفتوحة) and Form6.frm فتح صلاحية: password "891045"
    access-key: ${DOCUMENT_LOCK_ACCESS_KEY:891045}
  config-users:
    # ARCHIVE.frm m31_Click: password1 = "261015" (Frame3 key before config_users "معالجة المستخدمين" opens)
    access-key: ${CONFIG_USERS_ACCESS_KEY:261015}
  backup:
    directory: ${BACKUP_DIRECTORY:./backups}
    pg-dump-path: ${PG_DUMP_PATH:pg_dump}
