spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/macnz_manar_test
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  data:
    redis:
      host: localhost
      port: 6379

app:
  jwt:
    secret: test-only-secret-key-that-is-at-least-32-bytes-long
    expiration-ms: 86400000

springdoc:
  api-docs:
    enabled: false
