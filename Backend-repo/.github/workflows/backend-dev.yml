name: Backend Dev CI

on:
  push:
    branches: [dev]

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: 25

      - run: mvn clean test
      - run: mvn package -DskipTests

      - run: docker build -t startupstack/backend:dev ./docker
      - run: docker run -d -p 8080:8080 startupstack/backend:dev