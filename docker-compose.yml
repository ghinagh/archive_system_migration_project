name: macnz-manar-full-stack

services:
  # Database
  db:
    image: postgres:16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: macnz_manar
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API
  backend:
    build:
      context: ./Backend-repo
      dockerfile: docker/Dockerfile
    ports:
      - "8081:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/macnz_manar
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_FLYWAY_ENABLED=true
      # application-dev.yml hardcodes Windows paths (C:/media/...) for local IDE runs outside
      # Docker; these env vars win over that profile file (OS env vars outrank in-jar
      # application-{profile}.yml in Spring's property precedence) so the container always
      # resolves against the mounted media_data volume below, regardless of active profile.
      - MEDIA_BASE_PATH=/media
      - MEDIA_PICTURE_PATH=/media/pictures
      - MEDIA_ARCHIVE_PATH=/media/archive
    volumes:
      - media_data:/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Frontend SPA
  frontend:
    build:
      context: ./Frontend-repo
      dockerfile: docker/Dockerfile
    ports:
      - "4200:80"
    depends_on:
      - backend

volumes:
  pgdata:
  media_data:
